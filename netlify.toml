# Netlify build configuration — versioned with the app.
# Site: https://oc-lesson-planner.netlify.app (repo-linked to main; every
# push to main builds and publishes automatically).

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve real files first, route everything else to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false